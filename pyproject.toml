[project]
name = "local-pilot"
version = "0.2.0"
description = "OS-native contextual AI workspace — right-click any file and ask your local LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "Pillow>=11.0.0",
]

[project.scripts]
local-pilot = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
